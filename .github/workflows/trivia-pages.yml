name: Publish Dirty South Trivia Cockpits to GitHub Pages

on:
  push:
    branches:
      - trivia-cockpit-644
    paths:
      - "dst-archive/**"
      - ".github/workflows/trivia-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trivia cockpit branch
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload trivia archive
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dst-archive

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
