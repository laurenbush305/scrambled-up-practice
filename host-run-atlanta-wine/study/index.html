<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#291a36"><title>HOST RUN | The Wine Study Lounge</title><style>
:root{color-scheme:light;--ink:#291a36;--muted:#66586b;--cream:#fbf5eb;--paper:#fffdfa;--accent:#963857;--gold:#d49b4e;--line:#e6d9dc}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:17px/1.65 system-ui,sans-serif}button,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:12px 17px;background:var(--paper);color:var(--ink);font-weight:650;min-height:48px}button:hover{border-color:var(--accent)}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #c98231;outline-offset:3px}button.primary{background:var(--ink);color:white;border-color:var(--ink)}button.soft{background:#f5e4e9;color:#742542}a{color:#742542}header{background:var(--ink);color:#fff6ea;padding:24px max(20px,calc((100vw - 980px)/2));}header small{color:#efc487;text-transform:uppercase;letter-spacing:.16em;font-size:11px;font-weight:800}header h1{font:700 clamp(29px,5vw,43px)/1.1 Georgia,serif;margin:8px 0}header p{margin:8px 0;color:#e4d6e8;font-size:15px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}nav button{background:#392746;border:1px solid #6e5a79;color:white;font-size:14px;padding:9px 13px;min-height:44px}nav button[aria-current=true]{background:#f9eddf;color:#291a36}main{max-width:940px;margin:auto;padding:22px 18px 70px}.eyebrow{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--accent)}h2{font:700 clamp(25px,5vw,37px)/1.18 Georgia,serif;margin:6px 0 14px}h3{font-size:19px;line-height:1.35;margin:6px 0 12px}p{margin:8px 0 14px}.card{background:var(--paper);border:1px solid var(--line);padding:clamp(18px,4vw,34px);border-radius:20px;margin:14px 0;box-shadow:0 4px 18px #291a3606}.hero{background:#f4e5e9;border-color:#e9cbd6}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.muted{color:var(--muted);font-size:14px}.progress{height:8px;border-radius:20px;background:#e9dce1;overflow:hidden;margin:10px 0}.progress i{height:100%;background:var(--accent);display:block}.cue{background:#f4ead6;border-left:4px solid var(--gold);padding:16px;border-radius:9px;margin:17px 0}.answer{background:#f0e9f3;padding:18px;border-radius:12px;margin:16px 0}.content{font-size:clamp(18px,3vw,21px);line-height:1.62}.img{width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin:10px 0}.path{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.path button{text-align:left;line-height:1.35}.path small{display:block;color:var(--muted);font-weight:400;margin-top:6px}.pill{font-size:13px;border:1px solid var(--line);border-radius:20px;padding:5px 11px}.facts{padding-left:22px}.facts li{margin:7px 0}details{border-top:1px solid var(--line);padding:12px 0}summary{cursor:pointer;font-weight:650}.hide{display:none!important}.big{font-size:20px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.controls button{flex:1 1 135px}footer{color:var(--muted);font-size:13px;margin-top:30px}.focus main{max-width:700px}.focus .secondary,.focus header p{display:none}.large .content{font-size:24px}.large main{font-size:19px}#status{min-height:26px;color:var(--accent);font-size:14px}button:disabled{opacity:.6;cursor:default}@media(max-width:540px){header{padding:18px}main{padding:14px 12px 40px}nav{gap:5px}nav button{font-size:13px;padding:8px 10px}.card{padding:19px}.controls button{flex-basis:100%}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}@media print{header,nav,button,.secondary{display:none}body{background:white}.card{break-inside:avoid;box-shadow:none}}
</style></head><body><header><small>HOST RUN / Study-first edition</small><h1>The Wine Study Lounge 🍷</h1><p>Learn the tea. Make it stick. Host the room.</p><nav aria-label="Main navigation"><button data-view="home">Start here</button><button data-view="library">Lessons</button><button data-view="review">Review</button><button data-view="reference">Tour cheat sheet</button><button data-view="exam">Ready to quiz?</button></nav></header><main id="app"></main><script>
const DATA={"routeStages":[{"id":"welcome","order":0,"eyebrow":"CENTENNIAL OLYMPIC PARK","title":"Meet at the Olympic Rings","lane":"Host Flow","scene":"Start here. Set the tone before anyone has a glass in hand.","anchors":["The tour is 1.2 miles, with 4 wine stops, 2 bonus stops, and an approximate 2-hour run time.","The tour begins and ends at Centennial Olympic Park.","Wine should feel approachable. The tour is a wine experience, not a wine class."],"prompt":"Give your opening out loud. Hit the meeting point, what guests can expect, and the tone of the experience.","emergencyLine":"This is a wine experience, not a wine class. You don’t need to know anything, and if you like it, it’s good.","visualId":"rings"},{"id":"winebasics","order":1,"eyebrow":"BEFORE THE FIRST POUR","title":"Wine Basics","lane":"Wine Basics","scene":"Give guests just enough vocabulary to make the rest of the walk click.","anchors":["Acidity = crisp, refreshing, mouth-watering sensation.","Tannins = dry, grippy feeling, mostly in reds; from grape skins, seeds, and oak aging.","Body = how heavy or light wine feels.","Sweetness is about sugar, not fruitiness.","Structure balances acid, tannins, alcohol, and body.","Terroir is the idea that wine tastes like where it comes from.","Taste simply: look, smell, sip, notice how it feels."],"prompt":"Explain acidity, tannins, body, sweetness, structure, and terroir in normal-person language.","emergencyLine":"Acid is crisp, tannin is grip, body is weight, sweetness is sugar, structure is balance, terroir is place."},{"id":"history","order":2,"eyebrow":"ATLANTA / GEORGIA WINE HISTORY","title":"From Vineyard Colony to Comeback","lane":"Atlanta History","scene":"Before the mural, the script gives the arc of Georgia wine history.","anchors":["1732: Georgia was established with hopes of becoming England’s “Vineyard Colony.”","Late 19th century: Georgia became the 6th largest wine-producing state, with more than 20,000 acres of vineyards.","1907: Georgia enacted statewide prohibition, 12 years before national Prohibition.","1983: Georgia Farm Winery Act helped restart the industry; at least 40% of grapes used in farm-winery wines had to be grown in Georgia.","Dahlonega Plateau and Upper Hiwassee Highlands are official AVAs.","Atlanta became the culinary and retail heartbeat of Southern wine culture."],"prompt":"Tell the Georgia wine-history story as a clean timeline. Try to land 1732, late 1800s, 1907, and 1983 without looking.","emergencyLine":"1732 vineyard dream. Late-1800s boom. 1907 Prohibition wipes it out. 1983 Farm Winery Act helps bring it back."},{"id":"mural","order":3,"eyebrow":"BONUS STOP 01","title":"Freedom Fighters Mural","lane":"Stops","scene":"Corner of Andrew Young Intl Blvd & Williams St NW.","anchors":["Created by muralist Yehimi Cambron.","Features activists and community members.","Bridges the historic Civil Rights Movement and contemporary social justice movements.","The script frames civil rights as an ongoing, living journey rather than a closed chapter of the 1960s."],"prompt":"Host this stop out loud. Name the artist and explain why the mural belongs in an Atlanta story walk even though it is not about wine.","emergencyLine":"Yehimi Cambrón’s Freedom Fighters connects historic civil rights with contemporary social justice. Atlanta history is still moving.","visualId":"mural"},{"id":"sundial","order":4,"eyebrow":"STOP 01 / FIRST POUR","title":"The Sun Dial Bar","lane":"Stops","scene":"210 Peachtree St • uppermost floors of the Westin Peachtree Plaza.","anchors":["Recommended wine: Champagne.","The Sun Dial occupies floors 71–73.","It sits 723 feet above the city.","It offers a 360-degree panorama of the Atlanta skyline.","The script describes the wine program as celebratory, with high-quality producers suited to the upscale, romantic atmosphere."],"prompt":"Sell the first stop in 30 seconds. Include the height/floors, skyline payoff, and the recommended wine.","emergencyLine":"723 feet up, floors 71–73, 360-degree skyline, celebratory first pour: Champagne.","visualId":"sundial"},{"id":"lumen","order":5,"eyebrow":"STOP 02","title":"Lumen Lounge","lane":"Stops","scene":"181 Peachtree St • Ritz-Carlton, floor 6.","anchors":["Recommended wines: Sauvignon Blanc or Chardonnay / Chablis.","Polished contemporary lobby lounge.","Low amber lighting and marble surfaces.","Frequently hosts live entertainment.","The script emphasizes a sophisticated global wine selection, with high-quality whites and stellar reds."],"prompt":"Transition from the dramatic skyline energy of Sun Dial into Lumen Lounge. Make the mood shift clear.","emergencyLine":"Ritz-Carlton floor 6, polished amber-and-marble lounge, Sauvignon Blanc or Chardonnay / Chablis.","visualId":"lumen"},{"id":"redphone","order":6,"eyebrow":"BONUS STOP 02","title":"Red Phone Booth","lane":"Prohibition","scene":"17 Andrew Young International Blvd • the group does not go inside.","anchors":["Georgia’s statewide prohibition began in 1907 and lasted until 1935.","National Prohibition lasted 1920–1933.","Wealthy citizens used private locker clubs.","Working-class residents frequented “blind tiger” saloons serving low-alcohol near-beer.","Alcohol came in on railroad “jug trains.”","Appalachian foothills became hotbeds for illicit moonshine production."],"prompt":"Tell the Atlanta/Georgia Prohibition story like you are standing in front of the Red Phone Booth.","emergencyLine":"Georgia was dry 1907–1935: private locker clubs, blind tigers, jug trains, and moonshine kept the story going.","visualId":"redphone"},{"id":"atalian","order":7,"eyebrow":"STOP 03","title":"Atalian","lane":"Stops","scene":"60 Andrew Young International Blvd.","anchors":["Recommended wines: Rosé or Pinot Noir.","Glamorous fine-dining Italian restaurant.","Founded by veteran restaurateur Muzo Saritas.","Cinematic, theatrical design with velvet textures, glowing chandeliers, and plush booth seating.","The script frames wine as a central pillar of an “abundance-first” dining experience."],"prompt":"Host Atalian in 30 seconds, then explain where the Prohibition True/False game fits into the flow.","emergencyLine":"Cinematic Italian, Muzo Saritas, Rosé or Pinot Noir — then bring the Prohibition game into the room.","visualId":"atalian"},{"id":"whiteoak","order":8,"eyebrow":"STOP 04 / FINAL POUR","title":"White Oak","lane":"Stops","scene":"270 Peachtree St NW.","anchors":["Recommended wine: Cabernet Sauvignon.","Established in 2012 by Cindy and Alan LeBlanc.","17,000-square-foot space.","Southern comfort meets Southern European coastal culinary traditions.","Features a two-story glass wine cellar.","The script says the wine list has more than 450 labels."],"prompt":"Give the final-stop setup. Make White Oak feel like the satisfying, substantial ending to the walk.","emergencyLine":"2012, 17,000 square feet, two-story glass cellar, 450+ labels, and Cabernet for the final pour.","visualId":"whiteoak"},{"id":"closing","order":9,"eyebrow":"RETURN TO THE PARK","title":"Close the Walk","lane":"Host Flow","scene":"Bring the group back to Centennial Olympic Park and land the experience.","anchors":["Ask guests which wine was their favorite.","Thank them for being open to trying new things and trusting you to guide them.","Invite reviews on the platform they used to book.","Final idea: drink what you like, try new things, and do not overthink it."],"prompt":"Close the tour out loud. Ask for a favorite, thank the group, mention reviews, and end with the script’s relaxed wine philosophy.","emergencyLine":"Ask the favorite, thank the group, invite a review, and land it: drink what you like, try new things, don’t overthink it.","visualId":"rings"}],"wineCast":[{"id":"champagne","name":"Champagne","pron":"sham-pane","archetype":"The Grande Dame","tagline":"I survived war, royalty, bad PR, and six atmospheres of pressure. I can handle brunch.","servedAt":"Sun Dial","plotTwist":"Dom Pérignon did not invent Champagne. He was trying to stop the bubbles.","anchors":["True Champagne only comes from Champagne, France.","Primary grapes: Chardonnay, Pinot Noir, Pinot Meunier.","Bubbles come from a second fermentation inside the bottle.","Bottle pressure is about 5–6 atmospheres.","Lees aging creates brioche, toast, almond, and biscuit notes.","Brut is the dominant dry style; Champagne became celebration through royalty and marketing."],"tasting":["Lemon","Green apple","Pear","White peach","Brioche","Toast","Almond"],"pairings":["Seafood","Caviar","Brie","Triple-cream cheese","Fried food"],"confessional":"Give a 30-second Champagne story that includes protected geography, the bottle-pressure drama, and the Dom Pérignon myth.","privateEdit":"Regulated, war-tested, under five to six atmospheres of pressure, and still expected to make every event look effortless. Honestly, relatable.","tourReady":"True Champagne comes only from Champagne, France, and follows strict rules around geography and production. Its bubbles come from a second fermentation in the bottle, and aging on the lees helps create the brioche and toast notes people associate with the style.","producerNote":"The Dom Pérignon storyline is a PR plot twist: the packet says he did not invent Champagne and was actually trying to prevent the bubbles.","image":"assets/champagne.jpg","quickLine":"Protected place, second bottle fermentation, 5–6 atmospheres, lees = brioche, royalty + marketing made it celebration."},{"id":"sauvblanc","name":"Sauvignon Blanc","pron":"saw-vuhn-yon blahnk","archetype":"The Loud One","tagline":"Subtle left the group chat. I brought citrus, herbs, and opinions.","servedAt":"Lumen Lounge","plotTwist":"Sauvignon Blanc is one of Cabernet Sauvignon’s parents, alongside Cabernet Franc.","anchors":["Its name means “Wild White,” from French sauvage.","Classic French homes: Loire Valley and Bordeaux.","Marlborough, New Zealand made the louder tropical/citrus style globally famous.","Usually bright, high-acid, herbaceous, and intensely aromatic.","Stainless steel keeps it crisp; oak can make it rounder and richer.","Classic pairing: goat cheese; it also loves herbs, salads, seafood, and sushi."],"tasting":["Citrus","Green fruit","Tropical fruit","Fresh herbs","High acidity"],"pairings":["Goat cheese","Salads","Seafood","Sushi","Herb-forward dishes"],"confessional":"Explain why Sauvignon Blanc is easy to recognize, then contrast Loire/Bordeaux energy with Marlborough energy.","privateEdit":"She walks into the room smelling like citrus and herbs and immediately announces herself. Subtle has left the group chat.","tourReady":"Sauvignon Blanc is known for bright acidity and distinctive aromatic character. France gives us classic Loire and Bordeaux expressions, while Marlborough, New Zealand became famous for a louder, intensely aromatic style.","producerNote":"Family-tree chaos: Sauvignon Blanc and Cabernet Franc are the parents of Cabernet Sauvignon.","image":"assets/sauvignon-blanc.jpg","quickLine":"High-acid, loud aromatics, Loire/Bordeaux roots, Marlborough turned up the volume, goat cheese loves it."},{"id":"chardonnay","name":"Chardonnay / Chablis","pron":"shaar-duh-nay / shuh-blee","archetype":"The Shape-Shifter","tagline":"Butter bomb? Mineral queen? Blanc de Blancs? Pick a storyline. I contain multitudes.","servedAt":"Lumen Lounge","plotTwist":"Chablis is Chardonnay grown in northern Burgundy, not a different grape.","anchors":["Chardonnay’s original home is Burgundy, France.","It is the genetic child of Pinot Noir and Gouais Blanc.","Chablis is lean, high-acid, mineral-driven Chardonnay from northern Burgundy.","Oak adds vanilla/toast; malolactic fermentation creates buttery softness.","Cool climates lean lemon/green apple; warm climates lean pineapple/mango/ripe peach.","Blanc de Blancs Champagne is 100% Chardonnay."],"tasting":["Green apple","Lemon","Wet stone","Pineapple","Mango","Vanilla","Butter"],"pairings":["Roast chicken","Lobster","Cream sauces","Soft cheese","Oysters with Chablis"],"confessional":"Give me Chardonnay’s two personalities: Chablis versus the buttery/oaky style, and explain what winemaking creates the difference.","privateEdit":"Nobody knows which version of her is coming to the reunion. Lean Chablis? Butter-bomb California? Blanc de Blancs? She contains multitudes.","tourReady":"Chardonnay is unusually adaptable. In Chablis it tends to be lean, high-acid and mineral-driven, while oak and malolactic fermentation can create richer, toastier and more buttery styles.","producerNote":"Chablis is Chardonnay. Same grape, radically different edit.","image":"assets/chardonnay-chablis.jpg","quickLine":"Burgundy-born shape-shifter: Chablis is lean/mineral; oak + malolactic can make it rich and buttery."},{"id":"rose","name":"Rosé","pron":"roh-zay","archetype":"The Lifestyle Influencer","tagline":"Everybody thinks I’m just cute and pink. Meanwhile I may be older than your entire red-wine tradition.","servedAt":"Atalian","plotTwist":"Rosé is a method/style, not a grape.","anchors":["Rosé is usually made from red grapes with short skin contact.","Provence, France is the modern global headquarters for pale, dry Rosé.","Common grapes include Grenache, Syrah, Pinot Noir, and Sangiovese.","Modern dry Rosé is crisp, acidic, and light-to-medium bodied.","White Zinfandel became famous after fermentation stopped early and left sugar behind.","Sparkling Rosé can get color from brief skin contact or a small amount of red wine."],"tasting":["Strawberry","Watermelon","Raspberry","Citrus","Fresh herbs"],"pairings":["Seafood","Salads","Mediterranean dishes","Grilled vegetables","Light meats"],"confessional":"Explain Rosé to someone who thinks it is a grape. Give the method, Provence connection, and one modern culture note.","privateEdit":"Stop calling her a grape. Production has corrected you three times. She is a METHOD with excellent branding.","tourReady":"Rosé is a wine style, not a grape. It is usually made from red grapes with limited skin contact, which creates the pink color while keeping the wine fresh and light.","producerNote":"The packet argues that pale, lightly extracted wines may be closer to some ancient wine styles than the bold reds people think of as traditional.","image":"assets/rose.jpg","quickLine":"A method, not a grape. Short skin contact, Provence made pale/dry iconic, ancient roots with modern yacht branding."},{"id":"pinot","name":"Pinot Noir","pron":"pee-no nuh-waar","archetype":"The Heartbreak Grape","tagline":"I’m thin-skinned, expensive, emotionally complex, and somehow you’re still obsessed with me.","servedAt":"Atalian","plotTwist":"The 2004 movie Sideways gave Pinot Noir a huge U.S. sales boost.","anchors":["Pinot Noir is ancient and deeply tied to Burgundy.","Thin skins make it prone to rot, disease, and climate sensitivity.","It loves cool climates and expresses terroir very transparently.","Typical structure: pale ruby, lighter body, softer tannins, bright acidity.","Classic notes include cherry, raspberry, mushroom, wet leaves, truffle, tea, and rose petals.","It mutates easily and is related to Pinot Gris and Pinot Blanc."],"tasting":["Cherry","Raspberry","Cranberry","Mushroom","Truffle","Tea","Rose petals"],"pairings":["Duck","Salmon","Mushrooms","Roast chicken","Earthy vegetarian dishes"],"confessional":"Tell the Pinot Noir story like the cast member is literally called the Heartbreak Grape. Include why it is difficult and why people love it.","privateEdit":"Thin-skinned, temperamental, expensive, romantic, and one weather event away from a full emotional spiral. The Heartbreak Grape earned her title.","tourReady":"Pinot Noir is a light-bodied, thin-skinned red grape strongly associated with Burgundy and cool climates. It is prized for bright red fruit, earthy complexity and its ability to reflect place.","producerNote":"The 2004 film Sideways gave Pinot Noir a major U.S. popularity boost. Pop culture entered the vineyard and chose favorites.","image":"assets/pinot-noir.jpg","quickLine":"Thin-skinned Heartbreak Grape: cool climate, Burgundy, red fruit + earth, terroir transparency, Sideways boost."},{"id":"cab","name":"Cabernet Sauvignon","pron":"kab-er-nay saw-vuhn-yon","archetype":"The Heavyweight","tagline":"I built an empire, beat Bordeaux in Paris, and I brought tannins for everybody.","servedAt":"White Oak","plotTwist":"Cabernet Sauvignon is a natural cross between Cabernet Franc and Sauvignon Blanc.","anchors":["Cabernet Sauvignon emerged in Bordeaux and became a Left Bank backbone.","The 1976 Judgment of Paris helped establish Napa Cabernet as world-class.","It is dry, full-bodied, high-tannin, structured, and highly age-worthy.","Classic notes: blackcurrant, blackberry, black cherry, cedar, tobacco, graphite, leather.","Pyrazines can create green bell pepper, mint, and eucalyptus notes.","High tannins make it a classic partner for steak, lamb, and aged cheese."],"tasting":["Blackcurrant","Blackberry","Black cherry","Cedar","Tobacco","Graphite","Leather"],"pairings":["Ribeye","Filet mignon","Lamb","Aged cheeses"],"confessional":"Give Cabernet Sauvignon the heavyweight edit: origin story, Judgment of Paris, structure, and why steak loves it.","privateEdit":"Cabernet Franc and Sauvignon Blanc had one accidental child and that child built a global empire, won Paris, and brought tannins to the reunion.","tourReady":"Cabernet Sauvignon is a natural cross between Cabernet Franc and Sauvignon Blanc. It is typically full-bodied and high in tannin, with classic dark-fruit, cedar and tobacco notes and strong aging potential.","producerNote":"The 1976 Judgment of Paris helped establish Napa Cabernet as world-class after California wines beat prestigious French competitors in a blind tasting.","image":"assets/cabernet-sauvignon.jpg","quickLine":"Cab Franc + Sauvignon Blanc’s empire-building child: Bordeaux, Judgment of Paris, tannin, dark fruit, steak."}],"visualStops":[{"id":"rings","name":"Olympic Rings / Centennial Olympic Park","kind":"MEET + RETURN","image":"assets/olympic-rings.jpg","cue":"Meet at the Olympic Rings. The 1.2-mile tour starts and ends here.","wine":"No pour yet — set the tone.","sourceLabel":"CC0 photo: Wikimedia Commons","sourceUrl":"https://commons.wikimedia.org/wiki/File:Olympic_Symbol,_Centennial_Olympic_Park,_Atlanta,_GA_(47421273552).jpg","maps":"https://www.google.com/maps/search/?api=1&query=Olympic+Rings+Centennial+Olympic+Park+Atlanta"},{"id":"mural","name":"Freedom Fighters Mural","kind":"BONUS STOP","image":"assets/freedom-fighters-mural.jpg","cue":"Yehimi Cambrón. Historic Civil Rights Movement meets contemporary social justice. Living journey, not closed chapter.","wine":"Photo moment before the first pour.","sourceLabel":"Training packet photo / artist context","sourceUrl":"https://www.artsatl.org/this-week-in-street-art-the-murals-of-immigrant-activist-yehimi-cambron/","maps":"https://www.google.com/maps/search/?api=1&query=Freedom+Fighters+Mural+Andrew+Young+International+Blvd+Williams+St+Atlanta"},{"id":"sundial","name":"The Sun Dial","kind":"STOP 01","image":"assets/sun-dial.jpg","cue":"Uppermost Westin floors, 723 feet, 71st–73rd floors, 360-degree skyline.","wine":"Champagne","sourceLabel":"Training packet photo / venue site","sourceUrl":"https://discoveratlanta.com/stories/things-to-do/best-restaurants-for-quiet-conversations-in-atlanta/","maps":"https://www.google.com/maps/search/?api=1&query=The+Sun+Dial+210+Peachtree+St+Atlanta"},{"id":"lumen","name":"Lumen Lounge","kind":"STOP 02","image":"assets/lumen-lounge.jpg","cue":"Ritz-Carlton, floor 6. Polished lounge, amber light, marble, live entertainment.","wine":"Sauvignon Blanc or Chardonnay / Chablis","sourceLabel":"Training packet photo / venue site","sourceUrl":"https://www.ritzcarlton.com/en/hotels/atlrz-the-ritz-carlton-atlanta/dining/","maps":"https://www.google.com/maps/search/?api=1&query=Lumen+Lounge+181+Peachtree+St+Atlanta"},{"id":"redphone","name":"Red Phone Booth","kind":"BONUS STOP","image":"assets/red-phone-booth.jpg","cue":"You stay outside. This is the visual bridge into Georgia’s 1907–1935 Prohibition story.","wine":"No pour — Prohibition story.","sourceLabel":"Training packet photo / venue site","sourceUrl":"https://www.redphonebooth.com/locations/ga/atlanta","maps":"https://www.google.com/maps/search/?api=1&query=Red+Phone+Booth+17+Andrew+Young+International+Blvd+Atlanta"},{"id":"atalian","name":"Atalian","kind":"STOP 03","image":"assets/atalian.jpg","cue":"Cinematic Italian dining, theatrical design, Muzo Saritas, abundance-first wine experience.","wine":"Rosé or Pinot Noir","sourceLabel":"Training packet photo / venue site","sourceUrl":"https://www.atalian-atl.com/","maps":"https://www.google.com/maps/search/?api=1&query=Atalian+60+Andrew+Young+International+Blvd+Atlanta"},{"id":"whiteoak","name":"White Oak","kind":"STOP 04 / FINAL POUR","image":"assets/white-oak.jpg","cue":"2012, 17,000 square feet, Southern comfort + Southern Europe, two-story glass cellar, 450+ labels.","wine":"Cabernet Sauvignon","sourceLabel":"Training packet photo / venue site","sourceUrl":"https://www.whiteoakkitchen.com/","maps":"https://www.google.com/maps/search/?api=1&query=White+Oak+270+Peachtree+St+NW+Atlanta"}],"routeMapImage":"assets/route-map.jpg","questions":[{"id":"w1","lane":"Wine Basics","type":"mc","q":"What does acidity do in wine?","choices":["Makes it feel crisp and mouth-watering","Makes it automatically sweet","Only changes the color","Means it has more tannins"],"a":0,"ex":"The script describes acidity as crisp, refreshing, and mouth-watering."},{"id":"w2","lane":"Wine Basics","type":"mc","q":"What is the script’s everyday comparison for tannins?","choices":["Strong tea","Sparkling water","Cream","Orange juice"],"a":0,"ex":"Tannins create a dry, grippy feeling, like strong tea."},{"id":"w3","lane":"Wine Basics","type":"mc","q":"Where do tannins come from?","choices":["Grape skins, seeds, and oak aging","Only added sugar","Only yeast","Carbonation"],"a":0,"ex":"The script names grape skins, seeds, and oak aging."},{"id":"w4","lane":"Wine Basics","type":"mc","q":"Body means…","choices":["How heavy or light the wine feels","How dark the wine looks","How expensive it is","How long the label is"],"a":0,"ex":"Body is about weight/feel. The script uses skim milk, whole milk, and cream as comparisons."},{"id":"w5","lane":"Wine Basics","type":"tf","q":"A wine can taste fruity and still be dry.","a":true,"ex":"Correct. Sweetness is about sugar, not fruitiness."},{"id":"w6","lane":"Wine Basics","type":"mc","q":"Structure is the balance of…","choices":["Acid, tannins, alcohol, and body","Only fruit and sugar","Color and price","Region and label design"],"a":0,"ex":"That is the exact framework in the script."},{"id":"w7","lane":"Wine Basics","type":"mc","q":"Terroir is basically the idea that…","choices":["Wine tastes like where it comes from","All wines from one grape taste the same","Wine should always be aged in oak","Only French wine has regional character"],"a":0,"ex":"Soil, climate, elevation, weather, and surrounding environment can shape the wine."},{"id":"w8","lane":"Wine Basics","type":"mc","q":"What is the simple tasting sequence in the script?","choices":["Look → smell → sip → notice how it feels","Sip → swirl → score → spit","Smell → rate → pair → post","Look → photograph → sip → rank"],"a":0,"ex":"The script keeps tasting simple: look, smell, sip, pay attention to how it feels."},{"id":"w9","lane":"Wine Basics","type":"tf","q":"White wines are always light-bodied and red wines are always full-bodied.","a":false,"ex":"The script explicitly says whites can be full and reds can be light."},{"id":"w10","lane":"Wine Basics","type":"mc","q":"What is the only rule that really matters on this tour?","choices":["If you like it, it’s good","Always order the recommended wine","Never mix wine styles","Only red wine counts"],"a":0,"ex":"The script’s core rule: if you like it, it’s good."},{"id":"h1","lane":"Atlanta History","type":"mc","q":"In what year was Georgia established in the script’s wine-history timeline?","choices":["1732","1789","1865","1907"],"a":0,"ex":"1732."},{"id":"h2","lane":"Atlanta History","type":"mc","q":"What early wine ambition did Georgia have?","choices":["To become England’s “Vineyard Colony”","To ban grapes","To export only whiskey","To replace Savannah with vineyards"],"a":0,"ex":"The script says Georgia hoped to become England’s “Vineyard Colony.”"},{"id":"h3","lane":"Atlanta History","type":"mc","q":"Where were grapes planted in the early colonial effort?","choices":["Savannah’s Trustees Garden","Centennial Olympic Park","Dahlonega Square","Piedmont Park"],"a":0,"ex":"Savannah’s Trustees Garden."},{"id":"h4","lane":"Atlanta History","type":"mc","q":"By the late 19th century, Georgia ranked what among U.S. wine-producing states?","choices":["6th largest","2nd largest","12th largest","25th largest"],"a":0,"ex":"The script says 6th largest."},{"id":"h5","lane":"Atlanta History","type":"mc","q":"About how many vineyard acres does the script cite for Georgia’s late-1800s boom?","choices":["More than 20,000","About 2,000","About 500","More than 100,000"],"a":0,"ex":"More than 20,000 acres."},{"id":"h6","lane":"Atlanta History","type":"mc","q":"Georgia enacted statewide prohibition in…","choices":["1907","1920","1933","1935"],"a":0,"ex":"1907, twelve years before national Prohibition took effect."},{"id":"h7","lane":"Atlanta History","type":"mc","q":"What 1983 law helped restart Georgia’s wine industry?","choices":["Georgia Farm Winery Act","Georgia Vineyard Relief Act","Southern Wine Act","Farm Tourism Act"],"a":0,"ex":"Georgia Farm Winery Act of 1983."},{"id":"h8","lane":"Atlanta History","type":"mc","q":"Under the script’s description of the Georgia Farm Winery Act, at least what share of grapes had to be grown in Georgia?","choices":["40%","20%","51%","75%"],"a":0,"ex":"At least 40%."},{"id":"h9","lane":"Atlanta History","type":"mc","q":"Which two official AVAs does the script name?","choices":["Dahlonega Plateau + Upper Hiwassee Highlands","Napa Valley + Sonoma Coast","Blue Ridge + Savannah Coast","Athens Hills + Peachtree Plains"],"a":0,"ex":"Dahlonega Plateau and Upper Hiwassee Highlands."},{"id":"h10","lane":"Atlanta History","type":"mc","q":"How far north of Atlanta does the script place the historic North Georgia vineyards?","choices":["About 60–80 miles","About 10–20 miles","About 150–200 miles","About 300 miles"],"a":0,"ex":"About 60 to 80 miles north."},{"id":"r1","lane":"Route","type":"mc","q":"Where does the tour meet?","choices":["Olympic Rings in Centennial Olympic Park","The Sun Dial lobby","Red Phone Booth","White Oak"],"a":0,"ex":"Meet at the Olympic Rings in Centennial Olympic Park."},{"id":"r2","lane":"Route","type":"mc","q":"How long is the route?","choices":["1.2 miles","2.5 miles","0.5 miles","4 miles"],"a":0,"ex":"The guide says 1.2 miles."},{"id":"r3","lane":"Route","type":"mc","q":"How many wine stops and bonus stops?","choices":["4 wine stops + 2 bonus stops","3 + 3","5 + 1","4 + 4"],"a":0,"ex":"Four wine stops and two bonus stops."},{"id":"r4","lane":"Route","type":"mc","q":"What comes immediately after the Freedom Fighters Mural?","choices":["The Sun Dial Bar","Lumen Lounge","Red Phone Booth","Atalian"],"a":0,"ex":"Freedom Fighters Mural → Sun Dial."},{"id":"r5","lane":"Route","type":"mc","q":"What comes immediately after Lumen Lounge?","choices":["Red Phone Booth","White Oak","Freedom Fighters Mural","Centennial Olympic Park"],"a":0,"ex":"Lumen Lounge → Red Phone Booth."},{"id":"r6","lane":"Route","type":"mc","q":"Which stop is last?","choices":["White Oak","Atalian","Lumen Lounge","Sun Dial"],"a":0,"ex":"White Oak is the fourth and final wine stop."},{"id":"s1","lane":"Stops","type":"mc","q":"Who created the Freedom Fighters mural?","choices":["Yehimi Cambron","Cindy LeBlanc","Muzo Saritas","Alan LeBlanc"],"a":0,"ex":"The script names muralist Yehimi Cambron."},{"id":"s2","lane":"Stops","type":"mc","q":"What wine does the script recommend at The Sun Dial?","choices":["Champagne","Pinot Noir","Cabernet Sauvignon","Rosé"],"a":0,"ex":"Champagne."},{"id":"s3","lane":"Stops","type":"mc","q":"The Sun Dial occupies which floors?","choices":["71–73","60–62","40–42","6–8"],"a":0,"ex":"Floors 71 through 73."},{"id":"s4","lane":"Stops","type":"mc","q":"How high above the city does the script place The Sun Dial?","choices":["723 feet","500 feet","1,000 feet","320 feet"],"a":0,"ex":"723 feet."},{"id":"s5","lane":"Stops","type":"mc","q":"Which wines are recommended at Lumen Lounge?","choices":["Sauvignon Blanc and Chardonnay / Chablis","Champagne and Rosé","Cabernet Sauvignon and Pinot Noir","Riesling and Syrah"],"a":0,"ex":"Sauvignon Blanc or Chardonnay / Chablis."},{"id":"s6","lane":"Stops","type":"mc","q":"Lumen Lounge is on what floor of the Ritz-Carlton?","choices":["6","71","12","2"],"a":0,"ex":"Floor 6."},{"id":"s7","lane":"Stops","type":"mc","q":"Who founded Atalian, according to the script?","choices":["Muzo Saritas","Cindy LeBlanc","Alan LeBlanc","Yehimi Cambron"],"a":0,"ex":"Veteran restaurateur Muzo Saritas."},{"id":"s8","lane":"Stops","type":"mc","q":"Which wines are recommended at Atalian?","choices":["Rosé and Pinot Noir","Champagne and Chardonnay","Cabernet Sauvignon and Merlot","Sauvignon Blanc and Riesling"],"a":0,"ex":"Rosé and Pinot Noir."},{"id":"s9","lane":"Stops","type":"mc","q":"Which wine is recommended at White Oak?","choices":["Cabernet Sauvignon","Champagne","Sauvignon Blanc","Rosé"],"a":0,"ex":"Cabernet Sauvignon."},{"id":"s10","lane":"Stops","type":"mc","q":"How many labels does the script say White Oak’s wine list boasts?","choices":["Over 450","About 75","Exactly 200","Over 1,500"],"a":0,"ex":"More than 450 labels."},{"id":"s11","lane":"Stops","type":"mc","q":"Who established White Oak in 2012?","choices":["Cindy and Alan LeBlanc","Muzo and Cindy Saritas","Yehimi and Alan Cambron","The Ritz-Carlton"],"a":0,"ex":"Cindy and Alan LeBlanc."},{"id":"s12","lane":"Stops","type":"mc","q":"What visual feature anchors White Oak’s wine program?","choices":["A two-story glass wine cellar","A rooftop vineyard","A rotating tasting bar","A cellar beneath Centennial Park"],"a":0,"ex":"A floor-to-ceiling, two-story glass wine cellar."},{"id":"p1","lane":"Prohibition","type":"tf","q":"The national Prohibition ban began in February 1921 and ended in November 1934.","a":false,"ex":"FALSE. The script gives January 16, 1920 to December 5, 1933."},{"id":"p2","lane":"Prohibition","type":"tf","q":"National Prohibition lasted 13 years of “Dry.”","a":true,"ex":"TRUE."},{"id":"p3","lane":"Prohibition","type":"tf","q":"The Prohibition Party used an alpaca as its mascot.","a":false,"ex":"FALSE. The script says camel."},{"id":"p4","lane":"Prohibition","type":"tf","q":"Doctors never prescribed medicinal whiskey for ailments.","a":false,"ex":"FALSE. The script says doctors absolutely prescribed medicinal whiskey."},{"id":"p5","lane":"Prohibition","type":"tf","q":"Wine was allowed for religious ceremonies.","a":true,"ex":"TRUE."},{"id":"p6","lane":"Prohibition","type":"tf","q":"Due to Prohibition, organized crime spiked.","a":true,"ex":"TRUE. The script uses Al Capone as an example of bootlegging wealth and power."},{"id":"p7","lane":"Prohibition","type":"tf","q":"Illegal secret bars, or speakeasies, never thrived.","a":false,"ex":"FALSE. The script says speakeasies rose dramatically."},{"id":"p8","lane":"Prohibition","type":"tf","q":"The 18th Amendment did not outlaw drinking itself, only selling, producing, and transporting intoxicating liquor.","a":true,"ex":"TRUE, according to the tour game."},{"id":"p9","lane":"Prohibition","type":"tf","q":"Average alcohol consumption never dropped during Prohibition.","a":false,"ex":"FALSE. The script says it dropped 70% in the early years and remained lower afterward."},{"id":"p10","lane":"Prohibition","type":"tf","q":"The federal government ordered industrial alcohol poisoned, leading to more than 10,000 deaths.","a":true,"ex":"TRUE, according to the tour game."},{"id":"f1","lane":"Host Flow","type":"mc","q":"What question does the conclusion tell you to ask guests?","choices":["What was everybody’s favorite wine?","Who spent the most?","Which stop had the best food?","Who wants another tour right now?"],"a":0,"ex":"Ask which wine was everyone’s favorite."},{"id":"f2","lane":"Host Flow","type":"mc","q":"What does the conclusion invite guests to leave?","choices":["A review","A tip card","A wine score sheet","A written quiz"],"a":0,"ex":"The script asks for reviews on Google, TripAdvisor, or the booking platform."},{"id":"f3","lane":"Host Flow","type":"tf","q":"The tour script says guests need wine knowledge before attending.","a":false,"ex":"FALSE. It explicitly says guests do not need to know anything about wine."},{"id":"wc1","lane":"Wine Cast","type":"mc","q":"Which statement is the legal/geographic flex behind true Champagne?","choices":["It must come from Champagne, France","It must be 100% Chardonnay","It must be sweet","It must be aged 50 years"],"a":0,"ex":"Champagne is a protected geographic name. Sparkling wine from elsewhere is not Champagne."},{"id":"wc2","lane":"Wine Cast","type":"mc","q":"What creates Champagne’s bubbles?","choices":["A second fermentation inside the bottle","Shaking the bottle","Adding sparkling water","Oak aging"],"a":0,"ex":"Yeast consumes sugar during a second bottle fermentation, trapping carbon dioxide as bubbles."},{"id":"wc3","lane":"Wine Cast","type":"tf","q":"Dom Pérignon invented Champagne.","a":false,"ex":"False. The training material says he was actually trying to prevent the bubbles."},{"id":"wc4","lane":"Wine Cast","type":"mc","q":"Which flavor family is strongly associated with Champagne aging on lees?","choices":["Brioche and toast","Jalapeño and dill","Banana and coconut only","Blueberry jam"],"a":0,"ex":"Lees aging contributes brioche, toast, almond, and biscuit notes."},{"id":"wc5","lane":"Wine Cast","type":"mc","q":"Sauvignon Blanc’s name literally points to which idea?","choices":["Wild White","Royal White","Sweet White","Golden White"],"a":0,"ex":"The material traces Sauvignon to French sauvage, meaning wild."},{"id":"wc6","lane":"Wine Cast","type":"mc","q":"Which place is famous for turning Sauvignon Blanc’s volume all the way up?","choices":["Marlborough, New Zealand","Rioja, Spain","Napa only","Champagne, France"],"a":0,"ex":"Marlborough made the intense tropical/citrus New Zealand style globally famous."},{"id":"wc7","lane":"Wine Cast","type":"tf","q":"Sauvignon Blanc is one parent of Cabernet Sauvignon.","a":true,"ex":"True. Cabernet Franc is the other parent."},{"id":"wc8","lane":"Wine Cast","type":"mc","q":"What is the classic Sauvignon Blanc pairing in the material?","choices":["Goat cheese","Chocolate cake","Ribeye","Blue cheese only"],"a":0,"ex":"Goat cheese is the famous Loire pairing."},{"id":"wc9","lane":"Wine Cast","type":"mc","q":"Chablis is…","choices":["Chardonnay grown in northern Burgundy","A separate grape","Sweet Champagne","A red Bordeaux blend"],"a":0,"ex":"Chablis is Chardonnay, usually in a leaner, mineral-driven style."},{"id":"wc10","lane":"Wine Cast","type":"mc","q":"What winemaking process is closely tied to buttery Chardonnay?","choices":["Malolactic fermentation","Carbonation","Freezing the grapes","Adding sugar after bottling"],"a":0,"ex":"Malolactic fermentation softens malic acid into lactic acid, contributing buttery character."},{"id":"wc11","lane":"Wine Cast","type":"tf","q":"Blanc de Blancs Champagne can mean 100% Chardonnay.","a":true,"ex":"True. Chardonnay is a primary Champagne grape."},{"id":"wc12","lane":"Wine Cast","type":"mc","q":"Which profile best fits Chablis?","choices":["Lean, high-acid, mineral-driven","Sweet, heavy, jammy","High-tannin red","Fortified dessert wine"],"a":0,"ex":"The material describes Chablis as lean, high acid, mineral-driven, and bracingly fresh."},{"id":"wc13","lane":"Wine Cast","type":"mc","q":"Rosé is best understood as…","choices":["A method/style, not a grape","A grape from Provence","Sweet wine only","A Champagne synonym"],"a":0,"ex":"Rosé is made from red grapes handled with limited skin contact."},{"id":"wc14","lane":"Wine Cast","type":"mc","q":"If Rosé had a modern global headquarters, the material gives it to…","choices":["Provence","Bordeaux","Napa","Tuscany"],"a":0,"ex":"Pale, dry Provence Rosé became the model for the modern global style."},{"id":"wc15","lane":"Wine Cast","type":"tf","q":"Modern dry Rosé has to be sweet because it is pink.","a":false,"ex":"False. Dry Rosé is commonly crisp, acidic, and not sweet."},{"id":"wc16","lane":"Wine Cast","type":"mc","q":"White Zinfandel’s famous sweeter style began when…","choices":["Fermentation stopped early and left sugar behind","Red wine was mixed with soda","The wine was frozen","Oak was removed"],"a":0,"ex":"The material describes the sweeter style as an accidental stopped-fermentation moment."},{"id":"wc17","lane":"Wine Cast","type":"mc","q":"Why is Pinot Noir called the Heartbreak Grape?","choices":["Thin skins and extreme growing sensitivity","It is always sweet","It only grows indoors","It cannot age"],"a":0,"ex":"It is prone to rot/disease and highly sensitive to climate."},{"id":"wc18","lane":"Wine Cast","type":"mc","q":"Which note belongs naturally in Pinot Noir’s earthy edit?","choices":["Mushroom","Pineapple soda","Banana cream","Green bell pepper as the signature"],"a":0,"ex":"Mushroom, wet leaves, truffle, tea, and red fruits are classic notes in the material."},{"id":"wc19","lane":"Wine Cast","type":"tf","q":"The movie Sideways gave Pinot Noir a major popularity boost in the U.S.","a":true,"ex":"True. The material describes a major sales boost after the 2004 film."},{"id":"wc20","lane":"Wine Cast","type":"mc","q":"Which pairing fits Pinot Noir especially well?","choices":["Duck or salmon","Only steak","Only spicy curry","Only dessert"],"a":0,"ex":"Duck, salmon, mushrooms, roast chicken, and earthy vegetarian dishes all fit."},{"id":"wc21","lane":"Wine Cast","type":"mc","q":"Cabernet Sauvignon is the natural child of…","choices":["Cabernet Franc + Sauvignon Blanc","Pinot Noir + Chardonnay","Merlot + Syrah","Grenache + Riesling"],"a":0,"ex":"DNA testing identified Cabernet Franc and Sauvignon Blanc as its parents."},{"id":"wc22","lane":"Wine Cast","type":"mc","q":"What happened at the 1976 Judgment of Paris?","choices":["Napa Cabernet beat prestigious French Bordeaux in a blind tasting","Champagne was invented","Rosé became illegal","Chablis changed grapes"],"a":0,"ex":"The result helped establish Napa Cabernet as world-class."},{"id":"wc23","lane":"Wine Cast","type":"mc","q":"Which structure best describes Cabernet Sauvignon?","choices":["Full-bodied, high-tannin, age-worthy","Light, sweet, no tannin","Sparkling and delicate","Always low-acid white"],"a":0,"ex":"Cab is built around firm tannins, structure, and aging potential."},{"id":"wc24","lane":"Wine Cast","type":"mc","q":"Why is Cabernet such a steakhouse classic?","choices":["Tannins bind with fat and protein","It is always served warm","It has no tannins","It tastes like butter"],"a":0,"ex":"High tannins soften with fatty, protein-rich foods such as steak."},{"id":"wc25","lane":"Wine Cast","type":"mc","q":"Which three grapes does the packet name as Champagne’s primary trio?","choices":["Chardonnay, Pinot Noir, Pinot Meunier","Chardonnay, Riesling, Merlot","Pinot Noir, Syrah, Grenache","Cabernet Franc, Sauvignon Blanc, Chardonnay"],"a":0,"ex":"The packet names Chardonnay, Pinot Noir, and Pinot Meunier."},{"id":"wc26","lane":"Wine Cast","type":"mc","q":"About how much pressure is inside a Champagne bottle according to the packet?","choices":["5–6 atmospheres","1 atmosphere","20–30 atmospheres","No meaningful pressure"],"a":0,"ex":"About 5–6 atmospheres, which the packet compares to a car tire."},{"id":"wc27","lane":"Wine Cast","type":"tf","q":"Non-vintage Champagne is often blended from multiple years for consistency.","a":true,"ex":"True. The packet says many non-vintage Champagnes blend multiple years."},{"id":"wc28","lane":"Wine Cast","type":"mc","q":"What historical underground spaces helped Champagne producers protect wine and shelter communities during war?","choices":["Chalk cellars called crayères","Steel silos","Mountain caves in Bordeaux","Monastery bell towers"],"a":0,"ex":"The packet describes massive chalk cellars called crayères."},{"id":"wc29","lane":"Wine Cast","type":"mc","q":"Which style became dominant partly because British buyers preferred drier Champagne?","choices":["Brut","Demi-sec","Port","Rosé only"],"a":0,"ex":"The packet links the rise of Brut to British preference for drier wine."},{"id":"wc30","lane":"Wine Cast","type":"mc","q":"Cristal’s clear bottle was originally tied to what concern?","choices":["A Russian Tsar wanting to inspect for bombs or poison","Keeping wine colder","Showing the bubbles","Avoiding cork taint"],"a":0,"ex":"The packet says Cristal was bottled clear for a Russian Tsar concerned about bombs or poison."},{"id":"wc31","lane":"Wine Cast","type":"mc","q":"Where does the packet place Sauvignon Blanc’s French origins?","choices":["Loire Valley and Bordeaux","Burgundy only","Champagne only","Rhône Valley only"],"a":0,"ex":"Loire Valley and Bordeaux are the core French origins named."},{"id":"wc32","lane":"Wine Cast","type":"mc","q":"In Bordeaux, Sauvignon Blanc is often blended with…","choices":["Sémillon","Pinot Noir","Cabernet Sauvignon","Grenache"],"a":0,"ex":"The packet says Sauvignon Blanc is often blended with Sémillon in Bordeaux."},{"id":"wc33","lane":"Wine Cast","type":"mc","q":"Which Loire wines does the packet use as classic Sauvignon Blanc examples?","choices":["Sancerre and Pouilly-Fumé","Chablis and Meursault","Barolo and Barbaresco","Rioja and Cava"],"a":0,"ex":"Sancerre and Pouilly-Fumé."},{"id":"wc34","lane":"Wine Cast","type":"tf","q":"Oak is the only way to make Sauvignon Blanc.","a":false,"ex":"False. The packet contrasts crisp stainless-steel styles with rounder, richer oak-aged examples."},{"id":"wc35","lane":"Wine Cast","type":"mc","q":"Which food category does Sauvignon Blanc handle especially well because of its acidity and herbal notes?","choices":["Green, herb-forward foods","Only chocolate","Only steak","Only desserts"],"a":0,"ex":"The packet highlights salads, herbs, goat cheese, seafood and sushi."},{"id":"wc36","lane":"Wine Cast","type":"mc","q":"The packet’s personality shorthand for Sauvignon Blanc is basically…","choices":["Bright, zesty, herbaceous, aromatic","Soft, sleepy, low-acid","Sweet and fortified","Heavy, tannic red"],"a":0,"ex":"Bright, zesty, herbaceous and aggressively aromatic is the packet’s framing."},{"id":"wc37","lane":"Wine Cast","type":"mc","q":"What is Chardonnay’s original home according to the packet?","choices":["Burgundy, France","Marlborough, New Zealand","Napa Valley","Provence"],"a":0,"ex":"Burgundy, France."},{"id":"wc38","lane":"Wine Cast","type":"mc","q":"Chardonnay is genetically the child of Pinot Noir and…","choices":["Gouais Blanc","Sauvignon Blanc","Cabernet Franc","Sémillon"],"a":0,"ex":"The packet names Pinot Noir and Gouais Blanc."},{"id":"wc39","lane":"Wine Cast","type":"mc","q":"What ancient geology does the packet connect to Chablis?","choices":["Kimmeridgian limestone with fossilized oyster shells","Volcanic lava only","Desert sand","Granite from Champagne"],"a":0,"ex":"Kimmeridgian limestone packed with fossilized oyster shells."},{"id":"wc40","lane":"Wine Cast","type":"mc","q":"Cool-climate Chardonnay tends to lean toward…","choices":["Green apple, lemon, high acidity","Blackberry and leather","Only tropical fruit","Heavy tannin"],"a":0,"ex":"The packet lists green apple, lemon, high acidity and a leaner structure."},{"id":"wc41","lane":"Wine Cast","type":"mc","q":"Warmer-climate Chardonnay tends to show more…","choices":["Pineapple, mango, ripe peach","Forest floor and truffle only","Green bell pepper","Cassis and tobacco"],"a":0,"ex":"Pineapple, mango and ripe peach are listed as warmer-climate notes."},{"id":"wc42","lane":"Wine Cast","type":"tf","q":"The packet says American producers once used “Chablis” on inexpensive whites regardless of grape.","a":true,"ex":"True. It is presented as a historical naming controversy."},{"id":"wc43","lane":"Wine Cast","type":"mc","q":"What controls Rosé’s pink color most directly in the packet?","choices":["How long the juice contacts red-grape skins","Adding red food coloring","Oak age alone","Bottle shape"],"a":0,"ex":"Skin-contact time controls the depth of color."},{"id":"wc44","lane":"Wine Cast","type":"mc","q":"Which grapes does the packet name as common Rosé sources?","choices":["Grenache, Syrah, Pinot Noir, Sangiovese","Only Chardonnay","Only Cabernet Sauvignon","Riesling and Sémillon"],"a":0,"ex":"Grenache, Syrah, Pinot Noir, and Sangiovese are specifically named."},{"id":"wc45","lane":"Wine Cast","type":"mc","q":"What modern style made Provence Rosé famous?","choices":["Very pale, bone-dry, crisp, mineral-driven","Dark, sweet, fortified","Heavy oak and tannin","Warm and sparkling only"],"a":0,"ex":"The packet describes Provence as pale, bone-dry, crisp and mineral-driven."},{"id":"wc46","lane":"Wine Cast","type":"tf","q":"The packet says Rosé should only be treated as a summer wine.","a":false,"ex":"False. It specifically says Rosé has become a year-round category."},{"id":"wc47","lane":"Wine Cast","type":"mc","q":"Sparkling Rosé can get its color from…","choices":["Brief skin contact or blending a little red wine","Artificial dye only","Oak smoke","Lees alone"],"a":0,"ex":"Those are the two color routes named in the packet."},{"id":"wc48","lane":"Wine Cast","type":"mc","q":"Which tasting-note set belongs to dry Rosé in the packet?","choices":["Strawberry, watermelon, raspberry, citrus, fresh herbs","Cassis, cedar, tobacco","Brioche, almond, mushroom only","Green pepper, eucalyptus only"],"a":0,"ex":"That fruit-and-herb set is the packet’s dry Rosé profile."},{"id":"wc49","lane":"Wine Cast","type":"mc","q":"Which region anchors Pinot Noir’s history in the packet?","choices":["Burgundy","Provence","Marlborough","Napa only"],"a":0,"ex":"Burgundy is the historic anchor."},{"id":"wc50","lane":"Wine Cast","type":"mc","q":"Why does Pinot Noir tend to be lighter in color and tannin?","choices":["Its skins are thin","It has no skins","It is always diluted","It is a white grape"],"a":0,"ex":"Thin skins help explain the paler ruby color and softer tannins."},{"id":"wc51","lane":"Wine Cast","type":"mc","q":"Which climate does Pinot Noir generally prefer?","choices":["Cool climates","Only tropical climates","Hot deserts","Climate does not matter"],"a":0,"ex":"The packet says Pinot Noir loves cool climates and is extremely climate-sensitive."},{"id":"wc52","lane":"Wine Cast","type":"tf","q":"Pinot Noir mutates easily and is related to Pinot Gris and Pinot Blanc.","a":true,"ex":"True. The packet emphasizes Pinot’s genetic instability."},{"id":"wc53","lane":"Wine Cast","type":"mc","q":"Which profile does the packet associate with Burgundy Pinot Noir?","choices":["Earthy, mushroom and forest floor","Only tropical pineapple","Green pepper only","Butter and vanilla only"],"a":0,"ex":"Burgundy is described as leaning earthy, including mushroom and forest floor."},{"id":"wc54","lane":"Wine Cast","type":"mc","q":"What is one of Pinot Noir’s high-end prestige references in the packet?","choices":["Domaine de la Romanée-Conti","Marlborough Estate","Cristal Winery Napa","White Zinfandel Reserve"],"a":0,"ex":"Domaine de la Romanée-Conti is named as a prestigious Burgundy producer."},{"id":"wc55","lane":"Wine Cast","type":"mc","q":"Where does the packet place Cabernet Sauvignon’s emergence?","choices":["Bordeaux in the 17th century","Champagne in the 1800s","Provence in antiquity","Oregon in 2004"],"a":0,"ex":"The packet says it emerged in 17th-century Bordeaux."},{"id":"wc56","lane":"Wine Cast","type":"mc","q":"Cabernet became a backbone of which Bordeaux area?","choices":["Left Bank","Right Bank only","Champagne district","Loire Valley"],"a":0,"ex":"The packet specifically says Left Bank Bordeaux."},{"id":"wc57","lane":"Wine Cast","type":"mc","q":"Which compound family creates Cab’s green bell pepper, mint and eucalyptus notes?","choices":["Pyrazines","Lees","Lactic acid","Ethyl esters only"],"a":0,"ex":"The packet names pyrazines."},{"id":"wc58","lane":"Wine Cast","type":"mc","q":"Oak aging can add which notes to Cabernet?","choices":["Vanilla, toast, spice, smoke, dark chocolate","Only lemon and lime","Only wet stone","Only strawberry"],"a":0,"ex":"Those are the oak-linked notes listed."},{"id":"wc59","lane":"Wine Cast","type":"mc","q":"With significant age, Cabernet can develop…","choices":["Earth, leather, cigar box, savory complexity","Only watermelon","Only fresh herbs","Only brioche"],"a":0,"ex":"The packet names earth, leather, cigar box and savory complexity."},{"id":"wc60","lane":"Wine Cast","type":"tf","q":"The packet says top Cabernet can age for decades.","a":true,"ex":"True. It cites 20, 30 and even 50 years for top bottles."}],"producerCut":[{"id":"pc1","lane":"Producer's Cut","type":"mc","q":"Why did Champagne houses use underground crayères during wartime?","choices":["To store wine and shelter communities","To grow grapes underground","To make wine sweeter","To hide from British buyers"],"a":0,"ex":"The packet says producers stored wine in massive chalk cellars, and entire communities sheltered there during the World Wars."},{"id":"pc2","lane":"Producer's Cut","type":"mc","q":"What historical connection helped Champagne become associated with power and ceremony?","choices":["French kings were crowned in Reims","Roman emperors banned still wine","British monarchs invented Brut","Bordeaux merchants owned Champagne"],"a":0,"ex":"French kings were crowned in Reims, in Champagne country, and local wine became part of ceremony and prestige."},{"id":"pc3","lane":"Producer's Cut","type":"mc","q":"Which set belongs to aged Champagne’s tertiary notes?","choices":["Honey, hazelnut, mushroom, dried citrus, marzipan","Grass, gooseberry, cat pee","Cassis, graphite, leather","Watermelon, raspberry, herbs"],"a":0,"ex":"The packet separates primary, lees-derived secondary, and aged tertiary Champagne notes."},{"id":"pc4","lane":"Producer's Cut","type":"tf","q":"The packet calls fried food a secret-weapon Champagne pairing.","a":true,"ex":"True. Champagne’s acidity and bubbles make fried food one of the packet’s highlighted pairings."},{"id":"pc5","lane":"Producer's Cut","type":"mc","q":"What compound does the packet connect to Sauvignon Blanc’s green/herbaceous aroma?","choices":["Methoxypyrazine","Lactic acid","Lees","Ethyl esters"],"a":0,"ex":"Methoxypyrazine is the packet’s explanation for green, herbaceous aromas, including the notorious 'cat pee' note."},{"id":"pc6","lane":"Producer's Cut","type":"mc","q":"How does the packet contrast cool- and warm-climate Sauvignon Blanc?","choices":["Cool = citrus/mineral/restraint; warm = tropical/softer acid/more aromatic","Cool = sweet; warm = dry","Cool = red; warm = white","There is no climate difference"],"a":0,"ex":"That is the climate contrast stated in the packet."},{"id":"pc7","lane":"Producer's Cut","type":"tf","q":"Oak can make Sauvignon Blanc rounder, richer, and sometimes creamy.","a":true,"ex":"True. The packet contrasts crisp stainless-steel styles with rounder oak-aged styles."},{"id":"pc8","lane":"Producer's Cut","type":"mc","q":"What does ABC mean in the Chardonnay backlash story?","choices":["Anything But Chardonnay","Always Buy Chablis","All Burgundy Classified","Acid Before Cream"],"a":0,"ex":"The packet says 'Anything But Chardonnay' emerged as a backlash to heavily oaked, buttery styles."},{"id":"pc9","lane":"Producer's Cut","type":"mc","q":"What did medieval Burgundy monks carefully track in vineyards?","choices":["Soil, sun exposure, and drainage","Bottle labels and celebrity endorsements","Railroad routes","Only grape color"],"a":0,"ex":"The packet describes centuries of monastic observation of tiny plots, soil, sun, and drainage."},{"id":"pc10","lane":"Producer's Cut","type":"mc","q":"What nearly disrupted Chardonnay’s survival during the French Revolution?","choices":["Monastic/aristocratic vineyards were seized, divided, uprooted or replanted","A worldwide Chardonnay disease","Champagne outlawed it","New Zealand stopped exporting it"],"a":0,"ex":"The packet describes seized Burgundy land and vineyard disruption after 1789."},{"id":"pc11","lane":"Producer's Cut","type":"tf","q":"The packet describes Chardonnay as relatively neutral aromatically, making it a blank canvas for winemaking choices.","a":true,"ex":"True. Oak, stainless steel, lees work, and malolactic fermentation can dramatically shape it."},{"id":"pc12","lane":"Producer's Cut","type":"tf","q":"The packet argues Rosé may resemble some of the world’s earliest wine styles because ancient reds had brief skin contact.","a":true,"ex":"True. The packet presents Rosé-like pale wines as a plausible ancient style."},{"id":"pc13","lane":"Producer's Cut","type":"mc","q":"What cultural era does the packet connect to pale Provence Rosé’s modern boom?","choices":["2000s–2010s beach, yacht, and summer-luxury aesthetics","Victorian tea culture","1920s speakeasies","1970s Napa steakhouse culture"],"a":0,"ex":"The packet explicitly links Provence Rosé’s modern rise to beach/yacht/summer luxury and Instagram-able culture."},{"id":"pc14","lane":"Producer's Cut","type":"mc","q":"What accidentally helped create the sweeter White Zinfandel style in the 1970s?","choices":["Fermentation stopped early, leaving sugar behind","The wine was blended with Champagne","Oak aging doubled","The grapes were frozen"],"a":0,"ex":"The packet calls it an accidental stopped-fermentation story."},{"id":"pc15","lane":"Producer's Cut","type":"mc","q":"How does the packet contrast Pinot Noir across regions?","choices":["Burgundy = earthy; Willamette = cherry/acidity/elegance; Sonoma = riper fruit/spice","All regions taste identical","Burgundy = tropical; Oregon = heavy tannin; Sonoma = sweet","Only Burgundy can make Pinot Noir"],"a":0,"ex":"Those are the regional examples used in the packet."},{"id":"pc16","lane":"Producer's Cut","type":"mc","q":"Why does the packet call Pinot Noir a transparent voice of terroir?","choices":["It reflects soil, weather, and place very clearly","It has no aroma","It only grows in one vineyard","Its color changes every hour"],"a":0,"ex":"The packet repeatedly emphasizes Pinot Noir’s sensitivity and place expression."},{"id":"pc17","lane":"Producer's Cut","type":"tf","q":"Pinot Noir can be pale and light-bodied yet still age for decades in the right conditions.","a":true,"ex":"True. Thin skins mean lighter color/tannin, but high-quality Pinot can still age."},{"id":"pc18","lane":"Producer's Cut","type":"mc","q":"What did Sideways do to Pinot Noir’s cultural image in the packet?","choices":["Linked it to sensitive, intellectual, neurotic-romantic energy and boosted sales","Destroyed U.S. Pinot sales","Turned it into a dessert wine","Made Burgundy stop producing it"],"a":0,"ex":"The packet uses the film as a major pop-culture turning point."},{"id":"pc19","lane":"Producer's Cut","type":"mc","q":"What does the packet say Left Bank Bordeaux gravel does for Cabernet?","choices":["Drains well and retains heat for thick-skinned, late-ripening Cab","Makes Cabernet sparkling","Removes tannins","Creates sweetness"],"a":0,"ex":"The gravel-soil explanation appears in the Cabernet creation/expansion section."},{"id":"pc20","lane":"Producer's Cut","type":"mc","q":"Which places does the packet name in Cabernet’s global spread?","choices":["Napa, Chile, Australia, South Africa, Italy, Argentina","Only Bordeaux and Napa","Only France and Germany","Champagne, Chablis, Provence"],"a":0,"ex":"The packet lists those major wine-producing regions/countries."},{"id":"pc21","lane":"Producer's Cut","type":"tf","q":"The packet treats green bell pepper, mint, and eucalyptus in Cabernet as pyrazine-driven complexity rather than automatically a flaw.","a":true,"ex":"True. The packet explicitly says those notes can add complexity."},{"id":"pc22","lane":"Producer's Cut","type":"mc","q":"Why does the packet call Cabernet a luxury-market heavyweight?","choices":["It anchors collector, auction, and expensive Cabernet-based wine culture","It is always the cheapest wine","It cannot age","It is only used in cooking"],"a":0,"ex":"The closing Cabernet section emphasizes cultural and financial weight in the luxury market."}],"hotSeat":[{"id":"hs1","q":"A guest says: 'I taste peaches. Does that mean this wine is sweet?'","a":"No. The script says sweetness is about sugar, not fruitiness. A wine can taste like peaches or strawberries and still be dry.","anchors":["Sweetness = sugar","Fruitiness ≠ sweetness","Normalize guest perception"]},{"id":"hs2","q":"A guest asks: 'What are tannins, in normal-person language?'","a":"The script compares tannins to the dry, grippy feeling from strong tea. They mostly show up in reds and come from skins, seeds, and oak aging.","anchors":["Dry/grippy","Strong tea analogy","Skins + seeds + oak"]},{"id":"hs3","q":"A guest asks: 'What does terroir mean again?'","a":"The script defines terroir as the idea that wine tastes like where it comes from — soil, climate, elevation, weather, and nearby environmental influences.","anchors":["Place","Soil/climate/elevation/weather","Same grape can taste different"]},{"id":"hs4","q":"A guest says: 'Cat pee?! Why would anybody want that in wine?'","a":"The packet explains that Sauvignon Blanc’s green/herbaceous aromas come from methoxypyrazine. The weird descriptor is shorthand for a real aroma compound, not literal cat pee.","anchors":["Methoxypyrazine","Green/herbaceous","Descriptor, not ingredient"]},{"id":"hs5","q":"A guest asks: 'Wait, Chablis is Chardonnay?'","a":"Yes. The packet says Chablis is Chardonnay grown in northern Burgundy, usually in a lean, high-acid, mineral-driven style.","anchors":["Same grape","Northern Burgundy","Lean/high-acid/mineral"]},{"id":"hs6","q":"A guest asks why Champagne can only be called Champagne.","a":"The packet says true Champagne comes from Champagne, France and follows strict rules for geography, grapes, production method, and aging.","anchors":["Protected name","Champagne, France","Strict rules"]},{"id":"hs7","q":"A guest asks why Rosé is pink.","a":"The packet says Rosé is usually made from red grapes with short skin contact. The longer the juice sits on the skins, the deeper the color.","anchors":["Red grapes","Short skin contact","Timing controls color"]},{"id":"hs8","q":"A guest asks why Pinot Noir is called the Heartbreak Grape.","a":"The packet says Pinot has thin skins, is prone to rot and disease, is extremely climate-sensitive, and is difficult to grow.","anchors":["Thin skins","Disease/rot","Climate-sensitive"]},{"id":"hs9","q":"A guest asks why Cabernet works so well with steak.","a":"The packet says Cabernet’s high tannins bind with fat and protein, which makes the wine feel smoother alongside steak and other bold foods.","anchors":["High tannin","Fat + protein","Smoother with food"]},{"id":"hs10","q":"A guest asks what made Georgia wine disappear for decades.","a":"The tour script says Georgia’s statewide Prohibition began in 1907, wiping out legal production, and the industry stayed dormant until the Georgia Farm Winery Act of 1983 helped revive it.","anchors":["1907 Prohibition","Industry wiped out","1983 Farm Winery Act"]},{"id":"hs11","q":"A guest asks why the Freedom Fighters mural is on a wine tour.","a":"The script says it is important to Atlanta’s history and culture. Yehimi Cambrón’s mural connects the historic Civil Rights Movement to contemporary social justice and treats civil rights as an ongoing journey.","anchors":["Atlanta history/culture","Yehimi Cambrón","Past + present social justice"]},{"id":"hs12","q":"A guest says: 'I don’t know anything about wine. Am I going to be lost?'","a":"The tour introduction says the opposite: this is a wine experience, not a wine class. Guests do not need prior knowledge, and the only rule that matters is: if you like it, it’s good.","anchors":["Experience, not class","No prior knowledge","If you like it, it’s good"]}],"rumors":[{"id":"rr1","wine":"Champagne","claim":"Dom Pérignon invented Champagne.","answer":false,"receipt":"The packet says he did not invent it and was actively trying to prevent bubbly wine.","roast":"Production has revoked the invented-Champagne credit."},{"id":"rr2","wine":"Champagne","claim":"True Champagne is protected by geography and production rules.","answer":true,"receipt":"The packet says true Champagne must come from Champagne, France and follow strict rules.","roast":"The appellation lawyers have entered the group chat."},{"id":"rr3","wine":"Champagne","claim":"Brut became dominant partly because British buyers preferred drier wine.","answer":true,"receipt":"That buyer preference is part of the packet’s history of Brut.","roast":"The customer really did change the storyline."},{"id":"rr4","wine":"Sauvignon Blanc","claim":"Sauvignon Blanc is one of Cabernet Sauvignon’s parents.","answer":true,"receipt":"The other parent is Cabernet Franc.","roast":"The family tree has receipts."},{"id":"rr5","wine":"Sauvignon Blanc","claim":"Marlborough is in France.","answer":false,"receipt":"The packet places Marlborough in New Zealand.","roast":"Geography department would like a word."},{"id":"rr6","wine":"Sauvignon Blanc","claim":"The packet treats goat cheese as a classic Sauvignon Blanc pairing.","answer":true,"receipt":"It calls goat cheese a famous Loire pairing.","roast":"Goat cheese secured a recurring role."},{"id":"rr7","wine":"Chardonnay","claim":"Chablis is a separate grape from Chardonnay.","answer":false,"receipt":"Chablis is Chardonnay grown in northern Burgundy.","roast":"Same cast member. Different wardrobe."},{"id":"rr8","wine":"Chardonnay","claim":"Malolactic fermentation helps create the buttery Chardonnay style.","answer":true,"receipt":"The packet links malolactic fermentation to softer lactic-acid character.","roast":"Butter has a production credit."},{"id":"rr9","wine":"Chardonnay","claim":"Blanc de Blancs Champagne can be 100% Chardonnay.","answer":true,"receipt":"That connection is explicitly stated in the packet.","roast":"Crossover episode confirmed."},{"id":"rr10","wine":"Rosé","claim":"Rosé is a grape.","answer":false,"receipt":"The packet says Rosé is a method/style, usually made from red grapes with limited skin contact.","roast":"Please stop calling this woman by the wrong job title."},{"id":"rr11","wine":"Rosé","claim":"Provence is the packet’s modern headquarters for pale, dry Rosé.","answer":true,"receipt":"Provence is framed as the model that took over the world.","roast":"The yacht has docked in Provence."},{"id":"rr12","wine":"Rosé","claim":"Dry Rosé has to be sweet because it is pink.","answer":false,"receipt":"The packet says modern dry Rosé is crisp, acidic and not sweet.","roast":"Color has been cleared of these allegations."},{"id":"rr13","wine":"Pinot Noir","claim":"Pinot Noir is nicknamed the Heartbreak Grape.","answer":true,"receipt":"Thin skins, rot, disease and climate sensitivity are the reasons given.","roast":"The nickname survived fact-checking."},{"id":"rr14","wine":"Pinot Noir","claim":"Pinot Noir generally thrives in hot climates.","answer":false,"receipt":"The packet says Pinot Noir loves cool climates and needs a narrow Goldilocks zone.","roast":"Heat has been voted off the island."},{"id":"rr15","wine":"Pinot Noir","claim":"Sideways boosted Pinot Noir sales in the U.S.","answer":true,"receipt":"The packet explicitly gives the 2004 film a major pop-culture role.","roast":"A supporting actor stole the whole season."},{"id":"rr16","wine":"C
