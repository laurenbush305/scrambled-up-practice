const order=['route','basics','champagne','sauvblanc','chardonnay','rose','pinot','cab','atlanta','prohibition','host',...DATA.wineCast.map(w=>w.id+'-deep')];L.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));const all=L.flatMap(l=>l.items.map(x=>({...x,lesson:l.id})));
const key='hostRunStudyLounge20261127';let storageOK=true;let s={done:{},reviews:{},last:null,focus:false,large:false};try{const raw=JSON.parse(localStorage.getItem(key)||'null');if(raw)s={...s,...raw}}catch(e){storageOK=false}function save(){try{localStorage.setItem(key,JSON.stringify(s))}catch(e){storageOK=false}}
const app=document.querySelector('#app');let view='home',li=0,ci=0,phase='learn',revealed=false,hinted=false,reviewQueue=[],reviewIndex=0,quizQueue=[],qi=0,quizResult=null,quizScore=0,quizFinished=false;
const esc=x=>String(x??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));const btn=(label,act,cls='')=>'<button class="'+cls+'" data-action="'+act+'">'+label+'</button>';const photo=(path,alt)=>path?'<img class="img secondary" src="../'+esc(path)+'" alt="'+esc(alt)+'" loading="lazy" onerror="this.hidden=true">':'';
const due=()=>all.filter(x=>s.reviews[x.id]&&s.reviews[x.id].due<=Date.now());const pending=()=>all.filter(x=>!s.done[x.id]);const count=l=>l.items.filter(x=>s.done[x.id]).length;const set=(v)=>{stop();view=v;render();window.scrollTo(0,0)};const nextUnseen=()=>{const x=pending()[0];return x?[L.findIndex(l=>l.id===x.lesson),L.find(l=>l.id===x.lesson).items.findIndex(i=>i.id===x.id)]:[0,0]};
function openLesson(a,b=0){li=a;ci=b;phase='learn';revealed=false;hinted=false;s.last={li,ci};save();set('lesson')}
function mark(x,grade){s.done[x.id]=true;let old=s.reviews[x.id]||{level:0};let level=grade==='again'?0:grade==='hint'?Math.max(0,old.level):Math.min(4,old.level+1);let wait=grade==='again'?0:grade==='hint'?10*60000:[0,10*60000,86400000,3*86400000,7*86400000][level];s.reviews[x.id]={level,due:Date.now()+wait};save()}
function startReview(){reviewQueue=due();if(!reviewQueue.length)reviewQueue=all.filter(x=>s.done[x.id]).sort((a,b)=>(s.reviews[a.id]?.due||0)-(s.reviews[b.id]?.due||0)).slice(0,8);reviewIndex=0;revealed=false;hinted=false;set('review')}
function nextCard(){if(ci<L[li].items.length-1){ci++;openLesson(li,ci)}else{set('complete')}}
function speech(t){if(!('speechSynthesis'in window)){document.querySelector('#status').textContent='Audio is unavailable in this browser.';return}stop();let u=new SpeechSynthesisUtterance(t);u.rate=.9;u.onerror=()=>{let e=document.querySelector('#status');if(e)e.textContent='Audio could not play. Try again or use the text.'};speechSynthesis.speak(u)}function stop(){if('speechSynthesis'in window)speechSynthesis.cancel()}
function recall(x,review=false){return '<div class="eyebrow">'+(review?'Spaced review':'Practice · no pressure')+'</div><h2>'+esc(x.question)+'</h2><p class="muted">Say it out loud, think it, or write it on paper. Take all the time you want.</p>'+(!revealed?'<div class="controls">'+btn('Give me a clue','hint')+btn('Show me the answer','reveal','primary')+'</div>':'')+(hinted?'<div class="cue"><b>Memory hook</b><br>'+esc(x.cue||'Think back to the lesson and the place.')+'</div>':'')+(revealed?'<div class="answer content">'+esc(x.answer)+'</div><p class="muted">How did that feel? Be honest; this simply decides when it comes back.</p><div class="controls">'+btn('Show me again','grade-again')+btn('Needed a hint','grade-hint')+btn('I remembered it','grade-good','primary')+'</div>':'')}
function render(){document.body.classList.toggle('focus',s.focus);document.body.classList.toggle('large',s.large);document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.view===view||(view==='lesson'&&b.dataset.view==='library'))));let done=Object.keys(s.done).length;let h='';if(view==='home'){let [a,b]=nextUnseen();h='<div class="card hero"><div class="eyebrow">Your next move</div><h2>'+(!done?'Welcome to the lounge.':'Welcome back, host.')+'</h2><p>Start with one bite. Read or listen, connect it to a memory hook, then try a tiny recall. Stop whenever you want.</p><div class="controls">'+btn(s.last?'Resume last lesson':'Start learning','resume','primary')+btn(due().length?'Review '+due().length+' due':'Review what I learned','review-start')+'</div><p class="muted">'+done+' / '+all.length+' study bites visited · '+due().length+' ready for review. No score, no rush.</p><div class="progress"><i style="width:'+100*done/all.length+'%"></i></div></div><div class="card"><h3>Pick your energy</h3><p class="muted">A quick session starts at your next unvisited bite. You can leave after any card.</p><div class="controls">'+btn('One new bite','next-unseen')+btn('Open the full learning path','library')+btn('Quick tour-day reference','reference')+'</div></div><div class="card secondary"><h3>Make the room yours</h3><div class="row">'+btn(s.focus?'Exit focus mode':'Focus mode','focus')+btn(s.large?'Standard text':'Larger text','large')+'</div><p class="muted">Progress stays on this browser. Audio is optional. Every page works without a timer.</p></div>'}
else if(view==='library'){h='<div class="eyebrow">Learn at your pace</div><h2>Your learning path</h2><p>Essentials first. Deeper stories are available whenever you want them.</p><div class="path">'+L.map((l,i)=>'<button data-action="open-'+i+'">'+l.icon+' '+esc(l.title)+'<small>'+esc(l.subtitle)+' · '+count(l)+'/'+l.items.length+'</small></button>').join('')+'</div>'}
else if(view==='lesson'){let l=L[li],x=l.items[ci];h='<div class="row between"><span class="eyebrow">'+esc(l.title)+'</span><span class="pill">Bite '+(ci+1)+' of '+l.items.length+'</span></div><div class="progress"><i style="width:'+100*(ci+1)/l.items.length+'%"></i></div><article class="card">'+(phase==='learn'?'<div class="eyebrow">Learn · '+esc(l.subtitle)+'</div><h2>'+esc(x.title)+'</h2>'+(ci===0?photo(l.image,l.title):'')+'<div class="content">'+esc(x.answer)+'</div><div class="cue"><b>Make it stick</b><br>'+esc(x.cue||'Imagine explaining this to a guest.')+'</div><div class="controls">'+btn('🔊 Listen','listen')+btn('Try remembering','practice','primary')+'</div><div class="row secondary" style="margin-top:14px">'+btn('Keep reading','skip')+(ci?btn('Previous bite','prev'):'')+'</div>':recall(x))+'</article><p class="muted" id="status" role="status"></p><div class="row secondary">'+btn('All lessons','library')+btn('Save & go home','home')+'</div>'}
else if(view==='complete'){let l=L[li];h='<div class="card hero"><div class="eyebrow">Chapter break</div><h2>That’s a whole chapter, darling. 🥂</h2><p>'+count(l)+' of '+l.items.length+' bites visited in '+esc(l.title)+'. Your review queue will bring them back. You can stop here or continue.</p><div class="controls">'+btn('Next chapter','next-unseen','primary')+btn('Go home','home')+btn('Review now','review-start')+'</div></div>'}
else if(view==='review'){if(!reviewQueue.length||reviewIndex>=reviewQueue.length){h='<div class="card"><h2>'+(!done?'Learn your first bite before reviewing.':'That review session is complete.')+'</h2><p>'+due().length+' items currently due. You can revisit a lesson or take a break.</p><div class="controls">'+btn('Continue learning','next-unseen','primary')+btn('Start another review','review-start')+'</div></div>'}else{let x=reviewQueue[reviewIndex];h='<div class="row between"><span class="eyebrow">Review · '+esc(L.find(l=>l.id===x.lesson).title)+'</span><span class="pill">'+(reviewIndex+1)+' / '+reviewQueue.length+'</span></div><div class="card">'+recall(x,true)+'</div>'}}
else if(view==='reference'){h='<div class="eyebrow">Open-book tour companion</div><h2>Your cheat sheet</h2><p>Your training packet encourages notecards. Use this as a cue sheet, and check current venue menus/hours before your tour.</p><div class="card">'+photo(DATA.routeMapImage,'Tour route map')+'<h3>The route</h3>'+routes.filter(r=>!['winebasics','history'].includes(r.id)).map(r=>'<details><summary>'+esc(r.title)+'</summary>'+photo(DATA.visualStops.find(v=>v.id===r.visualId)?.image,r.title)+'<ul class="facts">'+r.anchors.map(a=>'<li>'+esc(a)+'</li>').join('')+'</ul>'+(LEARN_ROUTE_EXTRAS[r.id]||[]).map(a=>'<p>'+esc(a)+'</p>').join('')+(LEARN_LOGISTICS[r.id]?'<p class="muted">'+esc(LEARN_LOGISTICS[r.id])+'</p>':'')+'</details>').join('')+'</div><div class="card"><h3>The six wines</h3>'+DATA.wineCast.map(w=>'<details><summary>'+esc(w.name)+' · '+esc(w.servedAt)+'</summary><p>'+esc(w.pron)+'</p><p>'+esc(w.tourReady)+'</p><p><b>Taste:</b> '+esc(w.tasting.join(', '))+'</p><p><b>Pair:</b> '+esc(w.pairings.join(', '))+'</p></details>').join('')+'</div><div class="card"><h3>Pronunciation help</h3>'+DATA.pronunciations.map(x=>'<details><summary>'+esc(x.term)+'</summary>'+esc(x.phonetic)+'</details>').join('')+'</div><div class="card"><h3>Guest questions and script game</h3>'+DATA.hotSeat.map(x=>'<details><summary>'+esc(x.q)+'</summary>'+esc(x.a)+'</details>').join('')+DATA.rumors.map(x=>'<details><summary>'+esc(x.claim)+'</summary>'+(x.answer?'True. ':'False. ')+esc(x.receipt)+'</details>').join('')+'</div><div class="card"><h3>Packet-derived full review</h3>'+L.map(l=>'<details><summary>'+esc(l.title)+'</summary>'+l.items.map(x=>'<p><b>'+esc(x.title)+':</b> '+esc(x.answer)+'</p>').join('')+'</details>').join('')+'</div><button onclick="window.print()">Print this reference</button>'}
else if(view==='exam'){if(!quizQueue.length){h='<div class="card"><div class="eyebrow">Optional · no timer</div><h2>Ready for a little check?</h2><p>This is separate from learning. Choose it only when you feel ready. A short session samples the original question bank and explains every answer.</p><div class="controls">'+btn('Start 10 questions','quiz-start','primary')+btn('Back to study','home')+'</div></div>'}else if(quizFinished){h='<div class="card"><h2>Practice complete</h2><p>'+quizScore+' of '+quizQueue.length+' correct. Use this as a snapshot, not a verdict.</p><div class="controls">'+btn('Learn more','home')+btn('Another set','quiz-start')+'</div></div>'}else{let q=quizQueue[qi];let options=q.type==='tf'?['True','False']:q.choices||[];h='<div class="card"><span class="eyebrow">Optional quiz · '+(qi+1)+'/'+quizQueue.length+'</span><h2>'+esc(q.q)+'</h2><div class="controls">'+options.map((o,i)=>'<button data-action="quiz-'+i+'" '+(quizResult!==null?'disabled':'')+'>'+esc(o)+'</button>').join('')+'</div>'+(quizResult!==null?'<div class="answer"><b>'+(quizResult?'Correct!':'Here is the explanation.')+'</b><p>'+esc(q.ex)+'</p></div>'+btn('Next question','quiz-next','primary'):'')+'</div>'}}
app.innerHTML=h+'<footer>Study content adapted from your Urban Wine Walks tour script and the existing HOST RUN wine packet-derived material. <a href="../">Original HOST RUN</a>. '+(storageOK?'':'Browser storage is unavailable; progress may not persist.')+'</footer>'}
app.addEventListener('click',e=>{let a=e.target.closest('[data-action]')?.dataset.action;if(!a)return;if(a.startsWith('open-')){let n=Number(a.slice(5)),l=L[n],i=l.items.findIndex(x=>!s.done[x.id]);openLesson(n,Math.max(0,i));return}if(a==='resume'){let [i,j]=s.last?[s.last.li,s.last.ci]:nextUnseen();openLesson(i,j)}else if(a==='next-unseen'){openLesson(...nextUnseen())}else if(['home','library','reference'].includes(a))set(a);else if(a==='focus'||a==='large'){s[a]=!s[a];save();render()}else if(a==='review-start')startReview();else if(a==='listen')speech(L[li].items[ci].answer+' . Memory hook: '+L[li].items[ci].cue);else if(a==='practice'){stop();phase='practice';revealed=false;hinted=false;render()}else if(a==='hint'){hinted=true;render()}else if(a==='reveal'){revealed=true;render()}else if(a==='skip'){let x=L[li].items[ci];s.done[x.id]=true;if(!s.reviews[x.id])s.reviews[x.id]={level:0,due:Date.now()};save();nextCard()}else if(a==='prev')openLesson(li,Math.max(0,ci-1));else if(a.startsWith('grade-')){let grade=a.slice(6),x=view==='review'?reviewQueue[reviewIndex]:L[li].items[ci];mark(x,grade);if(grade==='again'&&view==='lesson'){phase='learn';revealed=false;hinted=false;render()}else if(view==='review'){if(grade==='again'&&reviewQueue.filter(i=>i.id===x.id).length<3)reviewQueue.push(x);reviewIndex++;revealed=false;hinted=false;render()}else nextCard()}else if(a==='quiz-start'){quizQueue=[...DATA.questions,...DATA.producerCut].filter(q=>q.type==='tf'||q.choices?.length).sort(()=>Math.random()-.5).slice(0,10);qi=0;quizScore=0;quizResult=null;quizFinished=false;set('exam')}else if(a==='quiz-next'){qi++;quizResult=null;if(qi>=quizQueue.length)quizFinished=true;render()}else if(a.startsWith('quiz-')){let q=quizQueue[qi],n=Number(a.slice(5));quizResult=q.type==='tf'?((n===0)===q.a):n===q.a;if(quizResult)quizScore++;render()}});
document.querySelector('nav').addEventListener('click',e=>{let v=e.target.closest('[data-view]')?.dataset.view;if(v==='review')startReview();else if(v)set(v)});render();
