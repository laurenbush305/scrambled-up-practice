<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6d24b8">
<title>Scrambled Up Training Lab</title>
<style>
  :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#24143c;background:#f4eaff}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top left,#fff6c9,transparent 35rem),linear-gradient(135deg,#f7efff,#eadcff)}
  main{width:min(680px,100%);background:#fff;border:6px solid #ffd44f;border-radius:28px;padding:32px;box-shadow:0 12px 0 #6d24b8,0 28px 60px rgba(61,25,95,.22);text-align:center}
  h1{margin:0 0 10px;color:#6d24b8;line-height:1.05;font-size:clamp(2rem,7vw,3.5rem)}
  p{line-height:1.55;color:#655676}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#23c7b8;margin-right:8px;animation:pulse 1s infinite alternate}
  #error{display:none;margin-top:18px;padding:14px;border:3px solid #f05265;border-radius:16px;background:#fff1f4;color:#982944;text-align:left;white-space:pre-wrap}
  @keyframes pulse{to{transform:scale(1.5);opacity:.55}}
</style>
</head>
<body>
<main>
  <h1>SCRAMBLED UP</h1>
  <p><span class="dot"></span>Loading your practice board…</p>
  <div id="error"></div>
</main>
<script>
(() => {
  "use strict";

  const SOURCE_URL = "https://raw.githubusercontent.com/laurenbush305/scrambled-up-practice/8ac35eeeabbe778b150a201145eeff449f2c3a78/index.html";
  const CACHE_KEY = "scrambledUpPinnedAppSourceV1";

  function replaceOnce(source, before, after, label) {
    const count = source.split(before).length - 1;
    if (count !== 1) throw new Error(`${label}: expected one match, found ${count}.`);
    return source.replace(before, after);
  }

  function patch(source) {
    if (source.includes("function gradeTypedGuess(){") && !source.includes('id="submit"')) return source;

    const replacements = [
      ["Type panel", `<div id="typePanel" class="panel hidden">
<label>Type your answer<div class="answer-row"><input id="answerInput" autocomplete="off" spellcheck="false"><button id="submit" class="secondary">Submit</button></div></label>
<div class="muted" style="margin-top:8px">Separate typing window: <b id="typeCount">8</b>s</div>
</div>`, `<div id="typePanel" class="panel hidden">
<label>Type your answer<input id="answerInput" autocomplete="off" spellcheck="false" enterkeyhint="done"></label>
<div class="muted" style="margin-top:8px">Press Enter to submit · Separate typing window: <b id="typeCount">8</b>s</div>
</div>`],
      ["Quick feedback", `function quickFlash(correct,points){
  const el=$("quickFlash");
  el.textContent=correct?\`Correct\${points?\` +\${points}\`:""}\`:"Missed";
  el.className="quick-flash "+(correct?"good":"bad");
  el.classList.remove("hidden");
  state.boardTimers.push(setTimeout(()=>el.classList.add("hidden"),500));
}`, `function quickFlash(correct,points,message="",duration=500){
  const el=$("quickFlash");
  el.textContent=message||(correct?\`Correct\${points?\` +\${points}\`:""}\`:"Missed");
  el.className="quick-flash "+(correct?"good":"bad");
  el.classList.remove("hidden");
  state.boardTimers.push(setTimeout(()=>el.classList.add("hidden"),duration));
}`],
      ["Typed grading", `function submitGuess(){if(state.phase!=="answering")return;state.pendingGuess=$("answerInput").value.trim();showReview(state.pendingGuess)}`, `function gradeTypedGuess(){
  if(state.phase!=="answering"||state.answerMode!=="type")return;
  state.pendingGuess=$("answerInput").value.trim();
  clearBoardTimers();
  $("typePanel").classList.add("hidden");
  $("readyPanel").classList.add("hidden");
  const correct=isAnswerMatch(state.pendingGuess,state.current);
  state.phase="transition";
  if(correct){
    const points=pointValue();
    attemptRecord(true);state.completed++;state.correct++;state.players[0].score+=points;renderPodiums();
    $("feedback").textContent="Correct";
    quickFlash(true,points,"",800);
    state.boardTimers.push(setTimeout(nextBoard,900));
  }else{
    attemptRecord(false,"other");upsertQueue("other");state.completed++;state.missed++;awardOpponentAfterMiss();
    $("feedback").textContent=\`Correct answer: \${state.current.answer}\`;
    quickFlash(false,0,\`Correct answer: \${state.current.answer}\`,1400);
    state.boardTimers.push(setTimeout(nextBoard,1500));
  }
}
function submitGuess(){
  if(state.phase!=="answering")return;
  if(state.answerMode==="type"){gradeTypedGuess();return}
  state.pendingGuess=$("answerInput").value.trim();showReview(state.pendingGuess)
}`],
      ["Flow label", `$("flowModeLabel").textContent=state.flowMode==="game"?"· Game Pace (auto-advance)":"· Training Pace (Ready to advance)";`, `$("flowModeLabel").textContent=state.answerMode==="type"?"· Type mode (auto-advance)":state.flowMode==="game"?"· Game Pace (auto-advance)":"· Training Pace (Ready to advance)";`],
      ["Enter binding", `$("start").onclick=startRound;$("countdownSkip").onclick=finishStageCountdown;$("buzz").onclick=buzz;$("submit").onclick=submitGuess;$("answerInput").onkeydown=e=>{if(e.key==="Enter")submitGuess()};`, `$("start").onclick=startRound;$("countdownSkip").onclick=finishStageCountdown;$("buzz").onclick=buzz;$("answerInput").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();submitGuess()}};`]
    ];

    let patched = source;
    for (const [label, before, after] of replacements) patched = replaceOnce(patched, before, after, label);

    const required = [
      !patched.includes('id="submit"'),
      patched.includes('function gradeTypedGuess(){'),
      patched.includes('isAnswerMatch(state.pendingGuess,state.current)'),
      patched.includes('setTimeout(nextBoard,900)'),
      patched.includes('setTimeout(nextBoard,1500)'),
      patched.includes('upsertQueue("other")'),
      patched.includes('$("gotIt").onclick=()=>grade(true);$("missedIt").onclick=()=>grade(false)'),
      patched.includes('round1:{boards:7,points:100}'),
      patched.includes('round2:{boards:5,points:150}'),
      patched.includes('speed:{seconds:150,points:250}'),
      patched.includes('ultimate:{seconds:60,target:3}'),
      patched.includes('state.selectedMode==="fullgame"'),
      patched.includes('scrambledUpAttemptsV3'),
      patched.includes('scrambledUpQueueV3')
    ];
    if (required.some(ok => !ok)) throw new Error("The safety check found an incomplete Type-mode update.");
    return patched;
  }

  function launch(source) {
    const patched = patch(source);
    document.open();
    document.write(patched);
    document.close();
  }

  function showError(error) {
    const box = document.getElementById("error");
    box.style.display = "block";
    box.textContent = "The practice app could not load. Refresh the page.\n\nTechnical detail: " + error.message;
  }

  fetch(SOURCE_URL, {cache: "force-cache"})
    .then(response => {
      if (!response.ok) throw new Error(`Source request returned ${response.status}`);
      return response.text();
    })
    .then(source => {
      try { localStorage.setItem(CACHE_KEY, source); } catch (_) {}
      launch(source);
    })
    .catch(error => {
      try {
        const cached = localStorage.getItem(CACHE_KEY);
        if (cached) return launch(cached);
      } catch (_) {}
      showError(error);
    });
})();
</script>
</body>
</html>
